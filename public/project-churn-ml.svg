<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Insurance churn prediction illustration</title>
  <desc id="desc">Dark analytics dashboard showing model predictions and churn segmentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset=".55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#083344"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="420" fill="url(#bg)"/>
  <g stroke="#67e8f9" opacity=".16"><path d="M70 90h760M70 210h760M70 330h760M140 40v340M450 40v340M760 40v340"/></g>
  <rect x="110" y="70" width="680" height="280" rx="30" fill="#020617" opacity=".62" stroke="#334155"/>
  <text x="150" y="122" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Churn Prediction Dashboard</text>
  <g transform="translate(150 165)" filter="url(#glow)">
    <rect width="120" height="130" rx="16" fill="#0e7490"/><rect x="155" y="38" width="120" height="92" rx="16" fill="#4f46e5"/><rect x="310" y="65" width="120" height="65" rx="16" fill="#7c3aed"/><rect x="465" y="18" width="120" height="112" rx="16" fill="#0891b2"/>
  </g>
  <path d="M160 285c85-75 150-35 230-92 88-62 160-15 255-92" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#020617" stroke="#67e8f9" stroke-width="4"><circle cx="160" cy="285" r="11"/><circle cx="390" cy="193" r="11"/><circle cx="645" cy="101" r="11"/></g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="22" fill="#a5f3fc"><text x="150" y="330">SVM</text><text x="255" y="330">Random Forest</text><text x="475" y="330">LogReg</text><text x="640" y="330">Decision Tree</text></g>
</svg>
